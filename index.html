<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 학년 과제 관리 달력</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 text-white rounded-lg">
          <i class="fa-solid fa-calendar-check text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900">2026 학년 과제 플래너</h1>
          <p class="text-xs text-slate-500">날짜별 수행평가 및 과제를 체계적으로 관리하세요</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-4">
        <div class="flex items-center bg-slate-100 rounded-lg p-1">
          <button id="prev-month" class="p-2 hover:bg-white rounded-md transition text-slate-600">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span id="current-month-year" class="px-4 font-bold text-slate-700 min-w-[120px] text-center"></span>
          <button id="next-month" class="p-2 hover:bg-white rounded-md transition text-slate-600">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
        <button id="today-btn" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-sm font-semibold transition text-slate-700">
          오늘
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 mt-6">
    <!-- Calendar Grid Container -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <!-- Days of Week Header -->
      <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50 text-center py-3 font-semibold text-sm text-slate-600">
        <div class="text-red-500">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="text-blue-500">토</div>
      </div>

      <!-- Days Grid -->
      <div id="calendar-days" class="grid grid-cols-7 auto-rows-fr divide-x divide-y divide-slate-100">
        <!-- JS Dynmically Generated -->
      </div>
    </div>
  </main>

  <!-- Task Modal -->
  <div id="task-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 transform transition-all">
      <div class="flex justify-between items-center mb-4">
        <div>
          <h3 id="modal-date-title" class="text-lg font-bold text-slate-900">과제 관리</h3>
          <p class="text-xs text-slate-500">선택한 날짜의 과제를 추가하거나 수정합니다</p>
        </div>
        <button id="close-modal" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- Add Form -->
      <form id="add-task-form" class="flex gap-2 mb-4">
        <input type="text" id="task-input" placeholder="새 과제 입력 (예: 미적분 수행평가)" required
          class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 추가
        </button>
      </form>

      <!-- Task List -->
      <div class="border-t border-slate-100 pt-3">
        <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">등록된 과제 목록</h4>
        <ul id="modal-task-list" class="space-y-2 max-h-60 overflow-y-auto custom-scrollbar">
          <!-- JS Dynamically Generated -->
        </ul>
      </div>
    </div>
  </div>

  <script>
    // ★ 여기에 아까 복사한 구글 앱스 스크립트 웹 앱 URL을 넣으세요!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqPItNzlY2UeK9ZACya9hmFsiF3m6RXhCulJ6OWH7tdfH41uS22qUA-yKE0KbuxTeAYw/exec";

    // App State
    let currentDate = new Date(2026, 0, 1);
    let selectedDateKey = null;
    let tasks = {}; // 서버에서 불러올 데이터 저장소

    // Elements
    const monthYearText = document.getElementById('current-month-year');
    const calendarDays = document.getElementById('calendar-days');
    const prevBtn = document.getElementById('prev-month');
    const nextBtn = document.getElementById('next-month');
    const todayBtn = document.getElementById('today-btn');
    
    const modal = document.getElementById('task-modal');
    const closeModalBtn = document.getElementById('close-modal');
    const modalDateTitle = document.getElementById('modal-date-title');
    const addTaskForm = document.getElementById('add-task-form');
    const taskInput = document.getElementById('task-input');
    const modalTaskList = document.getElementById('modal-task-list');

    // 구글 시트에서 데이터 불러오기 (Read)
    async function fetchTasks() {
      try {
        const response = await fetch(SCRIPT_URL);
        const rows = await response.json();
        
        tasks = {};
        rows.forEach(row => {
          // row 구조: [author, title, date, timestamp]
          const dateKey = row.date ? row.date.toString().substring(0, 10) : ''; 
          if (!tasks[dateKey]) {
            tasks[dateKey] = [];
          }
          tasks[dateKey].push({ text: row.title, completed: false });
        });
        renderCalendar();
      } catch (error) {
        console.error("데이터를 불러오지 못했습니다:", error);
      }
    }

    // 구글 시트에 데이터 전송하기 (Write)
    async function saveTaskToSheet(dateKey, title) {
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            author: "익명", // 필요시 작성자 입력란 추가 가능
            title: title,
            date: dateKey
          })
        });
        fetchTasks(); // 저장 후 최신 데이터 다시 불러오기
      } catch (error) {
        console.error("저장 실패:", error);
      }
    }

    // Render Calendar
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      monthYearText.textContent = `${year}년 ${month + 1}월`;

      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      calendarDays.innerHTML = '';

      for (let i = firstDayOfMonth; i > 0; i--) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'min-h-[110px] p-2 bg-slate-50/50 text-slate-300 text-sm select-none';
        dayDiv.textContent = prevMonthLastDay - i + 1;
        calendarDays.appendChild(dayDiv);
      }

      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayOfWeek = new Date(year, month, day).getDay();
        
        const dayDiv = document.createElement('div');
        dayDiv.className = 'min-h-[110px] p-2 bg-white hover:bg-indigo-50/30 transition cursor-pointer flex flex-col justify-between group border-t border-slate-100';
        
        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        let dayClass = 'font-semibold text-sm mb-1 inline-block w-6 h-6 leading-6 text-center rounded-full';
        
        if (isToday) {
          dayClass += ' bg-indigo-600 text-white';
        } else if (dayOfWeek === 0) {
          dayClass += ' text-red-500';
        } else if (dayOfWeek === 6) {
          dayClass += ' text-blue-500';
        } else {
          dayClass += ' text-slate-700';
        }

        const headerDiv = document.createElement('div');
        headerDiv.className = 'flex justify-between items-center';
        headerDiv.innerHTML = `<span class="${dayClass}">${day}</span>`;
        
        const taskListDiv = document.createElement('div');
        taskListDiv.className = 'flex-1 overflow-y-auto space-y-1 custom-scrollbar mt-1';

        const dayTasks = tasks[dateKey] || [];
        dayTasks.forEach((task) => {
          const taskBadge = document.createElement('div');
          taskBadge.className = `text-xs px-2 py-1 rounded truncate border bg-indigo-50 text-indigo-700 border-indigo-100 font-medium`;
          taskBadge.textContent = task.text;
          taskListDiv.appendChild(taskBadge);
        });

        dayDiv.appendChild(headerDiv);
        dayDiv.appendChild(taskListDiv);

        dayDiv.addEventListener('click', () => openModal(dateKey, year, month + 1, day));
        calendarDays.appendChild(dayDiv);
      }

      const totalCells = firstDayOfMonth + daysInMonth;
      const nextDays = (7 - (totalCells % 7)) % 7;
      for (let i = 1; i <= nextDays; i++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'min-h-[110px] p-2 bg-slate-50/50 text-slate-300 text-sm select-none';
        dayDiv.textContent = i;
        calendarDays.appendChild(dayDiv);
      }
    }

    // Modal Operations
    function openModal(dateKey, y, m, d) {
      selectedDateKey = dateKey;
      modalDateTitle.textContent = `${y}년 ${m}월 ${d}일 과제`;
      renderModalTasks();
      modal.classList.remove('hidden');
      taskInput.focus();
    }

    function closeModal() {
      modal.classList.add('hidden');
      taskInput.value = '';
      selectedDateKey = null;
    }

    function renderModalTasks() {
      modalTaskList.innerHTML = '';
      const dayTasks = tasks[selectedDateKey] || [];

      if (dayTasks.length === 0) {
        modalTaskList.innerHTML = `<li class="text-xs text-slate-400 text-center py-4">등록된 과제가 없습니다.</li>`;
        return;
      }

      dayTasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'flex items-center justify-between p-2 bg-slate-50 rounded-lg hover:bg-slate-100 transition';
        
        li.innerHTML = `
          <div class="flex items-center gap-2 overflow-hidden mr-2">
            <span class="text-sm text-slate-700 truncate">${task.text}</span>
          </div>
        `;
        modalTaskList.appendChild(li);
      });
    }

    // Task Submit
    addTaskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = taskInput.value.trim();
      if (!text || !selectedDateKey) return;

      saveTaskToSheet(selectedDateKey, text);
      taskInput.value = '';
      closeModal();
    });

    // Event Listeners
    prevBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    todayBtn.addEventListener('click', () => {
      currentDate = new Date();
      renderCalendar();
    });

    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Initial Fetch & Render
    fetchTasks();
  </script>
</body>
</html>
